name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more environment detail you include, the faster we can reproduce it.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong?
      placeholder: A clear summary of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant logs or error messages.
    validations:
      required: true
  - type: input
    id: opencode-mem-version
    attributes:
      label: opencode-mem version
      placeholder: e.g. 2.26.0
    validations:
      required: true
  - type: dropdown
    id: opencode-major
    attributes:
      label: OpenCode major version
      options:
        - OpenCode v2
        - OpenCode v1
        - Unsure
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      placeholder: e.g. 1.x or 2.x release / commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: bun-version
    attributes:
      label: Bun version
      placeholder: output of `bun --version`
    validations:
      required: false
  - type: textarea
    id: embedding-provider
    attributes:
      label: Embedding / AI provider (optional)
      description: If relevant, note embedding model and capture/provider setup.
      placeholder: e.g. local transformers model, OpenAI, Anthropic
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, config snippets (redact secrets), or related issues.
    validations:
      required: false
