version: 2

updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep this pin while OpenCode embeds Bun 1.3.14 (Ort::Env SIGILL on
      # onnxruntime-node 1.21–1.23) and nested installs ignore package overrides.
      # Intel Mac (darwin/x64) support is dropped; the pin is for Apple Silicon /
      # Linux / Windows nested OpenCode installs (#184 / #225).
      - dependency-name: "onnxruntime-node"
      # ESLint 10 / typescript-eslint do not support TypeScript 7 yet (peer: <6.1.0).
      - dependency-name: "typescript"
        versions: [">=7"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
